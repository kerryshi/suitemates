<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dean (Academic) avatar, Frutiger Aero look: glossy sky bubble, fresh green leaf, soft highlights. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.45" stop-color="#7fd3f7"/>
      <stop offset="1" stop-color="#1f7fc9"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9f27a"/>
      <stop offset="0.5" stop-color="#5cc23a"/>
      <stop offset="1" stop-color="#1f7a2c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="grass" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#b6ef6a"/>
      <stop offset="1" stop-color="#3e9e32"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="256" cy="256" r="240"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- soft clouds -->
    <ellipse cx="130" cy="150" rx="70" ry="22" fill="#fff" opacity="0.55"/>
    <ellipse cx="380" cy="110" rx="55" ry="18" fill="#fff" opacity="0.45"/>
    <!-- rolling hill -->
    <ellipse cx="256" cy="560" rx="360" ry="170" fill="url(#grass)"/>
    <!-- oak leaf -->
    <g transform="translate(256 262) rotate(-18)">
      <path fill="url(#leaf)" stroke="#1b5e22" stroke-width="6" stroke-linejoin="round"
        d="M0 -150
           C 30 -150 40 -125 30 -110 C 60 -118 78 -95 58 -72
           C 92 -72 102 -40 72 -26 C 104 -16 104 18 70 24
           C 92 46 80 76 46 70 C 52 96 30 112 12 104
           L 6 150 L -6 150 L -12 104
           C -30 112 -52 96 -46 70 C -80 76 -92 46 -70 24
           C -104 18 -104 -16 -72 -26 C -102 -40 -92 -72 -58 -72
           C -78 -95 -60 -118 -30 -110 C -40 -125 -30 -150 0 -150 Z"/>
      <path d="M0 -130 L0 140" stroke="#1b5e22" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M0 -70 L40 -92 M0 -70 L-40 -92 M0 -20 L56 -30 M0 -20 L-56 -30 M0 30 L48 48 M0 30 L-48 48"
        stroke="#1b5e22" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    </g>
    <!-- glossy top highlight -->
    <ellipse cx="256" cy="120" rx="200" ry="105" fill="url(#gloss)"/>
  </g>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="10"/>
</svg>
