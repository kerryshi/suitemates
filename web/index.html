<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suitemates</title>
<meta name="description" content="Three texting agents for UNC students: Dean for school, Penny for money, Sunny for plans.">
<style>
  :root {
    --bg: #2a2b2f; --bg-2: #232427; --card: #313237; --line: #3c3d43;
    --text: #f2f3f5; --muted: #a3a6ae;
    --dean: 59 130 246; --penny: 236 72 153; --sunny: 249 115 22;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--text); background: var(--bg);
    background-image: radial-gradient(1200px 600px at 50% -10%, #34353a 0%, transparent 60%), linear-gradient(180deg, var(--bg), var(--bg-2));
    font: 16px/1.5 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 48px 16px 64px; text-align: center; }
  h1 { font-size: clamp(2.2rem, 6vw, 3.2rem); margin: 0; letter-spacing: -.02em; }
  .tag { margin: 8px auto 0; color: var(--muted); font-size: 1.1rem; max-width: 560px; }
  .pick { margin: 40px 0 22px; font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  .agents { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 22px; }
  .agent {
    --c: var(--dean);
    position: relative; display: block; width: 100%; padding: 30px 20px 26px; cursor: pointer; text-align: center;
    color: inherit; font: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .agent.penny { --c: var(--penny); }
  .agent.sunny { --c: var(--sunny); }
  .agent:hover, .agent:focus-visible {
    transform: translateY(-6px); border-color: rgb(var(--c) / .55); outline: none;
    box-shadow: 0 18px 50px rgb(var(--c) / .22);
  }
  /* The colored light behind the avatar: soft at rest, brighter and wider on hover/focus. */
  .halo { position: relative; width: 170px; height: 170px; margin: 0 auto; }
  .halo::before {
    content: ""; position: absolute; inset: -18px; border-radius: 50%;
    background: radial-gradient(circle, rgb(var(--c) / .55) 0%, rgb(var(--c) / .22) 45%, transparent 70%);
    filter: blur(6px); opacity: .7; transform: scale(.92);
    transition: opacity .3s ease, transform .3s ease;
  }
  .agent:hover .halo::before, .agent:focus-visible .halo::before { opacity: 1; transform: scale(1.12); }
  .halo img {
    position: relative; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
    border: 3px solid rgb(var(--c) / .9); box-shadow: 0 0 0 6px rgb(var(--c) / .12), 0 10px 26px rgba(0,0,0,.45);
    transition: box-shadow .3s ease;
  }
  .agent:hover .halo img { box-shadow: 0 0 0 8px rgb(var(--c) / .22), 0 0 40px rgb(var(--c) / .55); }
  .agent h3 { margin: 20px 0 2px; font-size: 1.6rem; }
  .role { color: rgb(var(--c)); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .78rem; }
  .agent p { color: var(--muted); margin: 12px auto 18px; max-width: 280px; }
  .go { display: inline-block; padding: 10px 20px; border-radius: 999px; font-weight: 700; color: #fff;
    background: rgb(var(--c)); box-shadow: 0 6px 18px rgb(var(--c) / .35); }
  .fine { color: var(--muted); font-size: .9rem; margin-top: 34px; }

  /* QR sheet */
  dialog { border: 0; padding: 0; background: transparent; color: var(--text); max-width: calc(100vw - 32px); }
  dialog::backdrop { background: rgba(10,10,12,.72); backdrop-filter: blur(4px); }
  .sheet { --c: var(--dean); width: min(440px, calc(100vw - 32px)); background: var(--card); border: 1px solid rgb(var(--c) / .5);
    border-radius: 26px; padding: 26px 22px 22px; text-align: center; box-shadow: 0 30px 80px rgb(var(--c) / .25); }
  .sheet .who { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .sheet .who img { width: 54px; height: 54px; border-radius: 50%; border: 2px solid rgb(var(--c)); }
  .sheet h2 { margin: 0; font-size: 1.4rem; }
  .sheet .hint { color: var(--muted); margin: 10px 0 16px; }
  #qr { width: 280px; height: 280px; margin: 0 auto; padding: 12px; background: #fff; border-radius: 18px; box-shadow: 0 0 0 4px rgb(var(--c) / .4); }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; }
  .sheet .actions { display: flex; gap: 10px; margin-top: 18px; }
  .sheet a, .sheet button { flex: 1; padding: 12px; border-radius: 14px; font: 600 1rem inherit; font-family: inherit; text-decoration: none; cursor: pointer; }
  .sheet a { background: rgb(var(--c)); color: #fff; }
  .sheet button { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .url { color: var(--muted); font-size: .78rem; margin-top: 12px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>Suitemates</h1>
  <p class="tag">Friends in your texts for school, money and plans. No app to download.</p>
  <p class="pick">Pick your agent</p>
  <div class="agents">
    <button class="agent dean" data-agent="academic" data-name="Dean" data-avatar="dean">
      <div class="halo"><img src="/avatars/dean.png" alt=""></div>
      <h3>Dean</h3><div class="role">school</div>
      <p>Knows your Canvas: what's due, quizzes, exams, grades, and when a plan clashes with a deadline.</p>
      <span class="go">Get Dean</span>
    </button>
    <button class="agent penny" data-agent="financial" data-name="Penny" data-avatar="penny">
      <div class="halo"><img src="/avatars/penny.png" alt=""></div>
      <h3>Penny</h3><div class="role">money</div>
      <p>Watches your spending, roasts the 3 AM DoorDash, and tells you if you can afford it.</p>
      <span class="go">Get Penny</span>
    </button>
    <button class="agent sunny" data-agent="social" data-name="Sunny" data-avatar="sunny">
      <div class="halo"><img src="/avatars/sunny.png" alt=""></div>
      <h3>Sunny</h3><div class="role">plans</div>
      <p>Finds people who want to do what you want to do: pickup soccer, boba runs, beach trips.</p>
      <span class="go">Get Sunny</span>
    </button>
  </div>
  <p class="fine">Get one or all three. They share your schedule (never your grades or balance) so plans fit your week.</p>
</main>

<dialog id="sheet">
  <div class="sheet" id="sheetBox">
    <div class="who"><img id="sheetImg" src="" alt=""><h2 id="sheetTitle"></h2></div>
    <p class="hint">Scan with your iPhone camera to connect.</p>
    <div id="qr" role="img" aria-label="QR code"></div>
    <div class="url" id="sheetUrl"></div>
    <div class="actions"><a id="sheetLink" href="#">Use this device</a><button id="sheetClose" type="button">Close</button></div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const sheet = document.getElementById("sheet");
  let base = location.origin; // replaced by the public tunnel address when the server has one
  fetch("/config.json").then((r) => r.json()).then((c) => { if (c.publicUrl) base = c.publicUrl; }).catch(() => {});
  const phone = matchMedia("(pointer: coarse) and (max-width: 820px)").matches;
  const COLORS = { academic: "var(--dean)", financial: "var(--penny)", social: "var(--sunny)" };
  document.querySelectorAll(".agent").forEach((card) => {
    card.addEventListener("click", () => {
      const url = `${base}/join/${card.dataset.agent}`;
      if (phone || !window.QRCode) return (location.href = url); // on a phone, go straight to the form
      document.getElementById("sheetBox").style.setProperty("--c", COLORS[card.dataset.agent]);
      document.getElementById("sheetImg").src = `/avatars/${card.dataset.avatar}.png`;
      document.getElementById("sheetTitle").textContent = `Get ${card.dataset.name}`;
      document.getElementById("sheetUrl").textContent = url;
      document.getElementById("sheetLink").href = url;
      const qr = document.getElementById("qr");
      qr.innerHTML = "";
      new QRCode(qr, { text: url, width: 280, height: 280, colorDark: "#111214", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
      sheet.showModal();
    });
  });
  document.getElementById("sheetClose").addEventListener("click", () => sheet.close());
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.close(); });
</script>
</body>
</html>
